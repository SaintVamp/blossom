name: docker_pack
on:
#  schedule:
#    - cron: "0 17 * * *"
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: Login to Docker Registry
      uses: docker/login-action@v1
      with:
        registry: docker.io
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}


    - name: Build docker
      run: |
        cd "${GITHUB_WORKSPACE}"
        cd blossom-backend/backend/src/main/resources/static/editor
        cd ../../../../../../../blossom-editor
        npm install
        npm run build
        cp -r out/renderer/assets/ ../blossom-backend/backend/src/main/resources/static/editor/
        cp out/renderer/favicon.png ../blossom-backend/backend/src/main/resources/static/editor/
        cp out/renderer/index.html ../blossom-backend/backend/src/main/resources/static/editor/
        cd ../blossom-web
        npm install
        npm run build:spring
        cd ../blossom-backend
        mvn clean
        mvn package
        cd ..
        release_tag="$(date +%Y%m%d%k%M%S)"
        echo "release_tag=$release_tag" >> $GITHUB_ENV

    - name: Set Up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set Up Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: saintvamp/blossom:${{ env.release_tag }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: saintvamp/blossom:latest
